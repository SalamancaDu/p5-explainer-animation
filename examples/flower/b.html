<script id="animation-utils">
function clamp(value, lo = 0, hi = 1) { return Math.min(hi, Math.max(lo, value)); }
function smooth(t) { t = clamp(t); return t * t * (3 - 2 * t); }
function backOut(t, strength = 1.8) { t = clamp(t) - 1; return 1 + (strength + 1) * t ** 3 + strength * t ** 2; }
function seededValue(seed, id, bucket = 0) {
  const key = `${seed}:${id}:${bucket}`;
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) h = Math.imul(h ^ key.charCodeAt(i), 16777619);
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d); h ^= h >>> 15;
  h = Math.imul(h, 0x846ca68b); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function createAccumulator(events, apply, clear) {
  const ordered = events.map((event, index) => {
    if (!Number.isInteger(event.frame)) throw new Error(`笔触 ${index} 的 frame 必须是整数`);
    return { event, index };
  }).sort((a, b) => a.event.frame - b.event.frame || a.index - b.index);
  let cursor = 0, last = -Infinity;
  function reset() { clear(); cursor = 0; last = -Infinity; }
  return {
    reset,
    seek(frame) {
      if (!Number.isInteger(frame)) throw new Error("累积层 seek 需要整数帧");
      if (frame < last) reset();
      while (cursor < ordered.length && ordered[cursor].event.frame <= frame) {
        apply(ordered[cursor].event); cursor++;
      }
      last = frame;
    },
    get applied() { return cursor; }
  };
}
</script>

<script id="animation-scene">
const CONFIG = Object.freeze({
  "title": "想法开花",
  "fileName": "doodle",
  "width": 1920,
  "height": 1080,
  "fps": 30,
  "seconds": 6,
  "seed": 2077,
  "loop": true,
  "fontFamily": "Noto Sans SC",
  "fontWeight": 900,
  "fontSample": "想法开花归组示例六段素材分成两组123456×=",
  "fontCss": "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap",
  "p5Url": "https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"
});

function createScene(p,kit){
  const W=1920,H=1080,ink='#292b25',red='#c54b39';
  const paper=p.createGraphics(W,H);paper.pixelDensity(1);paper.background('#f4eedd');paper.noStroke();
  for(let i=0;i<15000;i++){paper.fill(86,70,48,12);paper.rect(kit.random('paperx'+i)*W,kit.random('papery'+i)*H,1.2,1.2);}
  const paths=[];
  function add(points,start,width=9,fill=null,id=paths.length){paths.push({points,start,width,fill,id});}
  const curve=(fn,n=70)=>Array.from({length:n+1},(_,i)=>fn(i/n));
  const ellipse=(cx,cy,rx,ry,turns=.97)=>curve(t=>[cx+rx*Math.cos(-1.9+t*Math.PI*2*turns),cy+ry*Math.sin(-1.9+t*Math.PI*2*turns)]);
  // The first frame already contains the character; the flower is drawn later.
  add(ellipse(425,470,123,142),-30,10);
  add(curve(t=>[305+t*245,410-95*Math.sin(t*Math.PI)]),-30,22,red);
  add([[345,590],[310,815],[535,815],[503,592]],-25,10);
  add([[346,664],[237,705],[220,680]],-20,10);add([[510,665],[624,577],[649,541]],-20,10);
  add([[355,817],[334,939],[289,942]],-20,11);add([[488,817],[514,936],[559,938]],-20,11);
  add(ellipse(385,459,10,16),-20,7,ink);add(ellipse(465,459,10,16),-20,7,ink);
  add(curve(t=>[391+t*62,515+22*Math.sin(t*Math.PI)]),-20,7);
  add(ellipse(699,365,129,86,.90),4,7);add([[610,427],[592,462],[648,440]],14,7);
  add(curve(t=>[645+105*t,365+22*Math.sin(t*Math.PI*4)]),22,6,red);
  add(curve(t=>[841+220*t,380-45*Math.sin(Math.PI*t)]),37,9);
  add([[1033,352],[1063,380]],52,9);add([[1063,380],[1026,397]],57,9);
  add(curve(t=>[1313+20*Math.sin(t*3),844-356*t]),63,12);
  add(curve(t=>[1318-200*Math.sin(t*Math.PI),724-96*Math.sin(t*Math.PI)*Math.cos(t*Math.PI)]),72,8,red);
  add(curve(t=>[1320+180*Math.sin(t*Math.PI),661-85*Math.sin(t*Math.PI)*Math.cos(t*Math.PI)]),80,8,red);
  for(let i=0;i<7;i++){const a=i*Math.PI*2/7;add(curve(t=>{const r=45+210*Math.sin(t*Math.PI);const aa=a+(t-.5)*.72;return[1310+r*Math.sin(aa),440-r*Math.cos(aa)];}),83+i*6,8,i%2===0?red:null);}
  add(ellipse(1310,440,57,57,1.02),129,10,red);
  for(let i=0;i<3;i++){const a=-1+i*.7;add([[1310+290*Math.cos(a),440+290*Math.sin(a)],[1310+326*Math.cos(a),440+326*Math.sin(a)]],134+i*3,7);}
  function drawPath(item,frame){
    const progress=kit.smooth((frame-item.start)/18);if(progress<=0)return;
    const bucket=Math.floor((frame+item.id%3)/3),points=item.points;
    const driftX=(kit.random('dx'+item.id,bucket)-.5)*4,driftY=(kit.random('dy'+item.id,bucket)-.5)*4;
    let total=0;const lengths=[0];for(let i=1;i<points.length;i++){total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);lengths.push(total);}
    const visible=[];for(let i=0;i<points.length;i++){if(lengths[i]>total*progress&&visible.length>1)break;visible.push([points[i][0]+driftX+(kit.random('x'+item.id+'-'+i,bucket)-.5)*2,points[i][1]+driftY+(kit.random('y'+item.id+'-'+i,bucket)-.5)*2]);}
    if(visible.length<2)return;
    if(item.fill&&progress===1){p.noStroke();p.fill(item.fill);p.beginShape();for(const [x,y]of visible)p.vertex(x+3,y+2);p.endShape(p.CLOSE);}
    const left=[],right=[];
    for(let i=0;i<visible.length;i++){const prev=visible[Math.max(0,i-1)],next=visible[Math.min(visible.length-1,i+1)],dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;const pressure=item.width*(.2+.8*Math.sin(Math.PI*(i+.4)/(visible.length+.1)))*(.9+.15*Math.sin(i*.4));left.push([visible[i][0]-dy/len*pressure/2,visible[i][1]+dx/len*pressure/2]);right.push([visible[i][0]+dy/len*pressure/2,visible[i][1]-dx/len*pressure/2]);}
    p.noStroke();p.fill(ink);p.beginShape();for(const q of [...left,...right.reverse()])p.vertex(...q);p.endShape(p.CLOSE);
    // Sparse paper bites affect the ink path, not the color fill.
    p.stroke('#f4eedd');p.strokeWeight(.9);for(let i=3;i<visible.length;i+=9){const [x,y]=visible[i];p.line(x,y,x+1.5,y+.4);}
  }
  return{reset(){},render(frame){p.push();p.scale(CONFIG.width/W,CONFIG.height/H);p.image(paper,0,0);for(const item of paths)drawPath(item,frame);p.pop();}};
}

</script>

<script id="animation-runtime">
(() => {
  "use strict";
  const totalFrames=Math.round(CONFIG.seconds*CONFIG.fps), controlled=new URLSearchParams(location.search).get("controlled")==="1";
  const localFile=location.protocol==="file:",messageTarget=localFile?"*":location.origin;
  function allowedOrigin(origin){return localFile?(origin==="null"||origin==="file://"):origin===location.origin;}
  const status=document.querySelector("#status"), buttons=[...document.querySelectorAll("nav button:not(#reload)")];
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let engine=null, scene=null, canvas=null, mode="loading", currentFrame=0, origin=0, startFrame=0, active=null, lastRecording=null, master=false;
  document.title=CONFIG.title;
  if(controlled){document.body.classList.add("controlled");document.querySelector("nav").hidden=true;status.hidden=true;}
  function tell(type,data={}){if(controlled&&parent!==window)parent.postMessage({type:`p5-animation:${type}`,...data},messageTarget);}
  function label(text,error=false){status.textContent=text;status.dataset.error=String(error);status.hidden=controlled&&!error;document.querySelector("#reload").hidden=!error;}
  function controls(){for(const b of buttons)b.disabled=mode==="loading"||mode==="error"||Boolean(active);}
  function fail(error){if(mode==="error")return;mode="error";if(engine)engine.noLoop();const text=error instanceof Error?error.message:String(error);label(`动画未能完成：${text}`,true);controls();tell("error",{message:text});}
  function loadResource(kind,url){return new Promise((resolve,reject)=>{
    const element=document.createElement(kind==="script"?"script":"link");let done=false;
    const finish=(error)=>{if(done)return;done=true;clearTimeout(timeout);element.onload=null;element.onerror=null;if(error){element.remove();reject(new Error(`${kind} 加载失败：${url}；${error}`));}else resolve();};
    const timeout=setTimeout(()=>finish("超过 20 秒"),20000);
    element.onload=()=>finish();element.onerror=()=>finish("网络或资源不可用");
    if(kind==="script"){element.src=url;element.async=true;}else{element.rel="stylesheet";element.href=url;}
    document.head.append(element);
  });}
  async function loadFont(){
    await loadResource("style",CONFIG.fontCss);
    let timeout;
    try{
      const faces=await Promise.race([document.fonts.load(`${CONFIG.fontWeight} 82px "${CONFIG.fontFamily}"`,CONFIG.fontSample),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error("中文字体字形加载超时")),20000);})]);
      if(!faces.length||faces.some(face=>face.status!=="loaded"))throw new Error(`中文字体未加载：${CONFIG.fontFamily}`);
    }finally{clearTimeout(timeout);}
  }
  function reseed(){engine.randomSeed(CONFIG.seed);engine.noiseSeed(CONFIG.seed);scene.reset();}
  function validateFrame(frame){
    if(!Number.isInteger(frame)||frame<0||frame>=totalFrames)throw new Error(`帧 ${frame} 超出 0..${totalFrames-1}`);
  }
  function render(frame,emit=true){
    validateFrame(frame);
    engine.randomSeed(CONFIG.seed+frame);engine.push();
    try{engine.resetMatrix();scene.render(frame);}catch(error){if(!active)fail(error);throw error;}finally{engine.pop();}
    currentFrame=frame;if(emit&&master)tell("frame",{frame});
  }
  function guard(){if(active)throw new Error("录制中无法暂停、重播或定位帧");if(mode==="error")throw new Error("场景出错，请重新加载");if(!scene)throw new Error("场景尚未准备好");}
  function pause(){guard();engine.noLoop();mode="paused";controls();label("已暂停 · R 录制 · S 保存 PNG");}
  function play(){guard();if(currentFrame===totalFrames-1){reseed();render(0);}startFrame=currentFrame;origin=engine.frameCount+1;mode="playing";engine.loop();controls();label("播放中 · 空格暂停 · R 录制 · S 保存 PNG");}
  function replay(){guard();engine.noLoop();reseed();render(0);startFrame=0;origin=engine.frameCount+1;mode="playing";engine.loop();controls();}
  function renderAt(frame){guard();validateFrame(frame);engine.noLoop();render(frame,false);mode="paused";controls();return getState();}
  function getState(){return{ready:Boolean(scene),mode,frame:currentFrame,totalFrames,fps:CONFIG.fps,recording:Boolean(active),reducedMotion:reduced,lastRecording};}
  function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  function savePNG(){
    if(!canvas)return Promise.reject(new Error("画布尚未准备好"));
    return new Promise((resolve,reject)=>{try{canvas.toBlob(blob=>{if(!blob){reject(new Error("PNG 编码返回空文件"));return;}try{download(blob,`${CONFIG.fileName}-${String(currentFrame).padStart(4,"0")}.png`);resolve({bytes:blob.size,frame:currentFrame});}catch(error){reject(new Error(`PNG 下载失败：${error.message}`));}},"image/png");}catch(error){reject(new Error(`PNG 导出失败：${error.message}`));}});
  }
  function record(){
    if(active)return active.promise;
    if(mode==="error")return Promise.reject(new Error("场景出错，请重新加载"));
    if(!scene)return Promise.reject(new Error("场景尚未准备好"));
    if(typeof MediaRecorder==="undefined"||typeof canvas.captureStream!=="function")return Promise.reject(new Error("此浏览器不支持画布 WebM 录制"));
    const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(value=>MediaRecorder.isTypeSupported(value));
    if(!mime)return Promise.reject(new Error("此浏览器没有可用的 WebM 编码器"));
    let resolveTask,rejectTask;
    const task={chunks:[],stream:null,recorder:null,error:null,started:0,stopping:false,promise:new Promise((resolve,reject)=>{resolveTask=resolve;rejectTask=reject;})};
    active=task;engine.noLoop();mode="recording";controls();
    function finish(){
      task.stream?.getTracks().forEach(track=>track.stop());active=null;mode="paused";engine.noLoop();controls();
      if(task.error){label(task.error.message,true);rejectTask(task.error);return;}
      try{
        const blob=new Blob(task.chunks,{type:task.recorder.mimeType||mime});if(!blob.size)throw new Error("录制完成但视频文件为空");
        lastRecording={bytes:blob.size,mime:blob.type,logicalFrames:totalFrames,lastFrame:currentFrame,targetSeconds:CONFIG.seconds,elapsedSeconds:(performance.now()-task.started)/1000};
        download(blob,`${CONFIG.fileName}.webm`);label("录制完成，WebM 已下载 · 实时时长以文件为准");resolveTask(lastRecording);
      }catch(error){label(`录像下载失败：${error.message}`,true);rejectTask(error);}
    }
    try{
      task.stream=canvas.captureStream(CONFIG.fps);task.recorder=new MediaRecorder(task.stream,{mimeType:mime,videoBitsPerSecond:8000000});
      task.recorder.ondataavailable=event=>{if(event.data.size)task.chunks.push(event.data);};
      task.recorder.onerror=event=>{task.error=new Error(`WebM 编码失败：${event.error?.message||"编码器错误"}`);engine.noLoop();};
      task.recorder.onstop=finish;
      task.recorder.onstart=()=>{
        if(task.error){if(task.recorder.state!=="inactive")task.recorder.stop();return;}
        label("正在录制一轮，请保持页面可见…");
      };
      task.started=performance.now();task.recorder.start();
      // Some encoders wait for the first changed canvas frame before onstart.
      // Produce frame 0 immediately, rather than waiting on that event to draw.
      reseed();render(0);startFrame=0;origin=engine.frameCount+1;engine.loop();
    }catch(error){task.error=new Error(`录制启动失败：${error.message}`);if(task.recorder&&task.recorder.state!=="inactive")task.recorder.stop();else finish();}
    return task.promise;
  }
  function cancelRecording(message){if(!active)return;active.error=new Error(message);engine.noLoop();if(active.recorder?.state!=="inactive")active.recorder.stop();}
  function action(fn){const report=error=>{if(mode!=="error")label(error.message,true);};try{Promise.resolve(fn()).catch(report);}catch(error){report(error);}}
  document.querySelector("#reload").onclick=()=>location.reload();
  document.querySelector("#toggle").onclick=()=>action(()=>mode==="playing"?pause():play());
  document.querySelector("#replay").onclick=()=>action(replay);
  document.querySelector("#record").onclick=()=>action(record);
  document.querySelector("#snapshot").onclick=()=>action(savePNG);
  addEventListener("keydown",event=>{
    if(event.repeat||controlled||event.ctrlKey||event.altKey||event.metaKey||event.target.closest("input,textarea,select,[contenteditable=true]"))return;
    const key=event.key.toLowerCase();if(!["r","s"," ","home"].includes(key))return;event.preventDefault();
    if(mode==="loading"||mode==="error"||active)return;
    action(()=>key==="r"?record():key==="s"?savePNG():key==="home"?replay():mode==="playing"?pause():play());
  });
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(active)cancelRecording("页面已隐藏，当前录制已取消，请返回后重新录制");else if(scene&&mode==="playing")pause();}});
  addEventListener("message",event=>{
    if(!controlled||event.source!==parent||!allowedOrigin(event.origin)||!scene||mode==="error")return;
    const message=event.data;if(!message||message.type!=="p5-animation:command")return;
    action(()=>{if(message.command==="seek")renderAt(message.frame);else if(message.command==="play"){master=true;play();}else if(message.command==="pause")pause();else if(message.command==="replay"){master=true;replay();}else if(message.command==="state")tell("state",getState());});
  });
  async function boot(){
    if(!Number.isInteger(totalFrames)||totalFrames<2||CONFIG.fps<=0)throw new Error("CONFIG 时长或帧率无效");
    if(!Number.isInteger(CONFIG.width)||!Number.isInteger(CONFIG.height)||CONFIG.width<=0||CONFIG.height<=0)throw new Error("CONFIG 画幅宽高必须是正整数");
    document.querySelector("#stage").style.setProperty("--canvas-ratio",String(CONFIG.width/CONFIG.height));
    await Promise.all([loadResource("script",CONFIG.p5Url),loadFont()]);
    if(typeof window.p5!=="function")throw new Error("p5.js 已加载但入口不可用");
    new window.p5(p=>{
      engine=p;
      p.setup=()=>{try{
        p.pixelDensity(1);canvas=p.createCanvas(CONFIG.width,CONFIG.height).parent("stage").elt;
        p.frameRate(CONFIG.fps);p.noLoop();p.randomSeed(CONFIG.seed);p.noiseSeed(CONFIG.seed);
        const kit=Object.freeze({totalFrames,clamp,smooth,backOut,accumulator:createAccumulator,random:(id,bucket=0)=>seededValue(CONFIG.seed,id,bucket)});
        scene=createScene(p,kit);reseed();render(0);mode="paused";controls();
        window.__animation=Object.freeze({config:Object.freeze({...CONFIG,totalFrames}),getState,renderAt,play,pause,replay,record,savePNG});
        tell("ready",{fps:CONFIG.fps,totalFrames,width:CONFIG.width,height:CONFIG.height});
        if(!controlled&&!reduced)play();else label("已就绪 · 点击播放，或按 R 录制");
      }catch(error){fail(error);}};
      p.draw=()=>{try{
        if(mode!=="playing"&&mode!=="recording")return;
        let frame=startFrame+p.frameCount-origin;
        if(frame>=totalFrames){
          if(active){p.noLoop();if(!active.stopping){active.stopping=true;active.recorder.stop();}return;}
          if(CONFIG.loop){reseed();origin=p.frameCount;startFrame=0;frame=0;}else{p.noLoop();mode="paused";controls();return;}
        }
        render(frame);
      }catch(error){if(active)cancelRecording(`绘制失败：${error.message}`);else fail(error);}};
    });
  }
  boot().catch(fail);
})();
</script>
